<!doctype html>
<!--
  Chat bubbles adapted from Flowbite's default and clean chat examples (MIT).
  https://flowbite.com/docs/components/chat-bubble/

-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Langfuse chat</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #202123; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; display: flex; flex-direction: column; font-size: 15px; line-height: 1.65; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .4; }
    button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid #71717a; outline-offset: 4px; }
    svg { width: 20px; height: 20px; flex-shrink: 0; }
    header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; }
    header strong { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
    nav { display: flex; gap: 14px; margin-left: auto; }
    nav a, details a { color: #525252; font-size: 12px; text-underline-offset: 3px; }
    #prompt-info { font-size: 12px; color: #737373; }
    #model { color: #737373; font-size: 12px; background: #f5f5f5; padding: 3px 10px; border-radius: 20px; }
    #clear { margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 7px 11px; color: #525252; background: transparent; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 13px; }
    #clear:hover { background: #f5f5f5; }
    main { flex: 1; min-height: 0; overflow-y: auto; }
    .column { width: min(100%, 800px); margin: 0 auto; padding-inline: 24px; }
    #welcome { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    #welcome[hidden] { display: none; }
    h1 { margin: 0 0 24px; font-size: clamp(24px, 4vw, 32px); font-weight: 500; letter-spacing: -.8px; line-height: 1.3; }
    #starter { border: 1px solid #e5e5e5; border-radius: 24px; padding: 9px 16px; background: #fff; color: #525252; font-size: 13px; }
    #starter:hover { background: #f5f5f5; }
    #messages:empty { display: none; }
    #messages { padding-top: 24px; padding-bottom: 24px; }
    article { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 28px; }
    article.user { justify-content: flex-end; }
    .avatar { width: 30px; height: 30px; display: grid; place-items: center; flex-shrink: 0; border: 1px solid #e5e5e5; border-radius: 50%; margin-top: 3px; }
    .avatar svg { width: 16px; height: 16px; }
    .message { min-width: 0; max-width: 100%; }
    .user .message { max-width: 85%; padding: 10px 18px; border-radius: 22px; background: #f3f3f3; }
    article p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .agent .message { padding-top: 3px; }
    .error p { color: #b42318; }
    .thinking { color: #737373; }
    details { margin-top: 12px; font-size: 12px; color: #737373; }
    summary { cursor: pointer; width: fit-content; }
    details p { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.8; }
    footer { padding-top: 8px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: #fff; }
    form { display: flex; align-items: flex-end; gap: 12px; padding: 14px 14px 14px 20px; border: 1px solid #e5e5e5; border-radius: 26px; background: #f7f7f8; box-shadow: 0 2px 8px #00000005; }
    form:focus-within { border-color: #b8b8bc; }
    textarea { flex: 1; min-width: 0; max-height: 160px; padding: 4px 0; border: 0; background: transparent; color: inherit; line-height: 1.6; resize: none; }
    textarea:focus-visible { outline: none; }
    textarea::placeholder { color: #85858d; }
    #send { display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; padding: 0; border: 0; border-radius: 50%; background: #202123; color: #fff; }
    #send:disabled { background: #d4d4d8; opacity: 1; }
    .footnote { margin: 10px 0 0; text-align: center; font-size: 11px; color: #85858d; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 520px) { header { padding: 14px 16px; gap: 8px; flex-wrap: wrap; } nav { order: 4; flex-basis: 100%; justify-content: center; } .column { padding-left: 16px; padding-right: 16px; } #model { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #clear span { display: none; } }
  </style>
</head>
<body>
  <header>
    <strong>Langfuse chat</strong>
    <span id="model">Ollama</span>
    <nav aria-label="Langfuse tools">
      <a id="prompts-link" hidden target="_blank" rel="noopener noreferrer">Edit prompt</a>
      <a id="playground-link" hidden target="_blank" rel="noopener noreferrer">Playground</a>
    </nav>
    <button id="clear" type="button" aria-label="Clear chat" title="Clear chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 3l5 5M10 14l3-1 9-9-2-2-9 9-1 3Z"/></svg>
      <span>Clear chat</span>
    </button>
  </header>
  <main id="conversation" aria-label="Conversation">
    <section id="welcome">
      <h1>What can I help you with?</h1>
      <p id="prompt-info">Loading the Langfuse prompt…</p>
      <button id="starter" type="button">Check Langfuse health</button>
    </section>
    <div id="messages" class="column" role="log" aria-label="Messages" aria-live="polite"></div>
  </main>
  <footer class="column">
    <form id="chat">
      <textarea id="prompt" rows="1" aria-label="Message" placeholder="Message the agent…" required></textarea>
      <button id="send" type="submit" aria-label="Send message" title="Send message" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
      </button>
    </form>
    <p class="footnote">Edit and save your prompt in Langfuse, then send a message to try it. Each message is independent.</p>
    <div id="status" class="sr-only" role="status"></div>
  </footer>
  <template id="agent-avatar">
    <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/></svg></div>
  </template>
  <script>
    const form = document.querySelector('#chat');
    const prompt = document.querySelector('#prompt');
    const send = document.querySelector('#send');
    const clear = document.querySelector('#clear');
    const starter = document.querySelector('#starter');
    const welcome = document.querySelector('#welcome');
    const status = document.querySelector('#status');
    const messages = document.querySelector('#messages');
    const conversation = document.querySelector('#conversation');
    let pending = false;

    fetch('/health').then(response => response.ok ? response.json() : null).then(health => {
      if (health) {
        document.querySelector('#model').textContent = health.model;
        document.querySelector('#prompt-info').textContent = `Using ${health.promptName} (${health.promptLabel}).`;
        for (const [id, url] of [['prompts-link', health.promptsUrl], ['playground-link', health.playgroundUrl]]) {
          const link = document.getElementById(id);
          link.href = url;
          link.hidden = false;
        }
      }
    }).catch(() => {});

    function scrollToLatest() {
      conversation.scrollTop = conversation.scrollHeight;
    }

    function resizeInput() {
      prompt.style.height = 'auto';
      prompt.style.height = `${Math.min(prompt.scrollHeight, 160)}px`;
      send.disabled = pending || !prompt.value.trim();
    }

    function addMessage(role, text) {
      welcome.hidden = true;
      const message = document.createElement('article');
      message.className = role;
      message.setAttribute('aria-label', role === 'user' ? 'You' : 'Agent');
      if (role === 'agent') message.append(document.querySelector('#agent-avatar').content.cloneNode(true));
      const bubble = document.createElement('div');
      bubble.className = 'message';
      const content = document.createElement('p');
      content.textContent = text;
      bubble.append(content);
      message.append(bubble);
      messages.append(message);
      scrollToLatest();
      return { message, bubble, content };
    }

    prompt.addEventListener('input', resizeInput);
    prompt.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    clear.addEventListener('click', () => {
      messages.replaceChildren();
      welcome.hidden = false;
      status.textContent = '';
      prompt.value = '';
      resizeInput();
      prompt.focus();
    });
    starter.addEventListener('click', () => {
      prompt.value = 'Is Langfuse healthy?';
      resizeInput();
      form.requestSubmit();
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const text = prompt.value.trim();
      if (!text || pending) return;
      pending = true;
      addMessage('user', text);
      const reply = addMessage('agent', 'Thinking…');
      reply.content.classList.add('thinking');
      reply.message.setAttribute('aria-busy', 'true');
      prompt.value = '';
      resizeInput();
      prompt.disabled = clear.disabled = starter.disabled = true;
      status.textContent = 'Thinking…';
      try {
        const response = await fetch('/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || `Request failed (${response.status}). Please try again.`);
        document.querySelector('#model').textContent = result.model;
        reply.content.textContent = result.answer;
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = 'Run details';
        const metadata = document.createElement('p');
        metadata.textContent = `Prompt: ${result.prompt.name} v${result.prompt.version} (${result.prompt.label})\nModel: ${result.model}\nTool calls: ${result.toolCalls}\nTrace: ${result.traceId}`;
        const traceLink = document.createElement('a');
        traceLink.textContent = 'View trace in Langfuse';
        traceLink.href = result.traceUrl;
        traceLink.target = '_blank';
        traceLink.rel = 'noopener noreferrer';
        details.append(summary, metadata, traceLink);
        reply.bubble.append(details);
        status.textContent = 'Recorded in Langfuse.';
      } catch (error) {
        reply.message.classList.add('error');
        reply.content.textContent = error.message;
        prompt.value = text;
        status.textContent = 'Could not get a reply. You can retry your message.';
      } finally {
        reply.content.classList.remove('thinking');
        reply.message.removeAttribute('aria-busy');
        pending = false;
        prompt.disabled = clear.disabled = starter.disabled = false;
        resizeInput();
        scrollToLatest();
        prompt.focus({ preventScroll: true });
      }
    });
  </script>
</body>
</html>
