name: Publish NuGet

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to NuGet.org
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check publishing configuration
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::Set the NUGET_USER GitHub Actions variable to your NuGet.org profile username."
            exit 1
          fi
          compgen -G 'artifacts/packages/*.nupkg' > /dev/null
          compgen -G 'artifacts/packages/*.snupkg' > /dev/null

      - name: Sign in to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols --skip-duplicate
          dotnet nuget push "artifacts/packages/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
