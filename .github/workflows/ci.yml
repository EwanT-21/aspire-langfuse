name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test, and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Aspire CLI bundle
        shell: bash
        env:
          ASPIRE_HOME: ${{ runner.temp }}/aspire
          AspireCliPath: ${{ runner.temp }}/aspire/bin/aspire
        run: |
          # Match Aspire.AppHost.Sdk in the AppHost projects.
          curl --fail --silent --show-error --location \
            https://aspire.dev/install.sh --output "$RUNNER_TEMP/install-aspire.sh"
          bash "$RUNNER_TEMP/install-aspire.sh" \
            --version 13.6.1 --install-path "$ASPIRE_HOME/bin" --skip-path
          # Prepare the bundle once before both AppHosts build in parallel.
          "$AspireCliPath" setup --install-path "$ASPIRE_HOME"
          echo "$ASPIRE_HOME/bin" >> "$GITHUB_PATH"
          echo "ASPIRE_HOME=$ASPIRE_HOME" >> "$GITHUB_ENV"
          echo "AspireCliPath=$AspireCliPath" >> "$GITHUB_ENV"

      - name: Verify release version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          package_version="$(dotnet msbuild src/Aspire.Langfuse.csproj -nologo -getProperty:PackageVersion)"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match project version 'v$package_version'."
            exit 1
          fi
          if [[ "$RELEASE_PRERELEASE" == "true" && "$package_version" != *-* ]]; then
            echo "::error::A prerelease needs a prerelease project version, for example 0.2.0-beta.1."
            exit 1
          fi
          if [[ "$RELEASE_PRERELEASE" != "true" && "$package_version" == *-* ]]; then
            echo "::error::Mark this GitHub release as a prerelease to match the project version."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Aspire.Langfuse.slnx

      - name: Build
        run: dotnet build Aspire.Langfuse.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test tests/Aspire.Langfuse.Tests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results

      - name: Pack
        run: >-
          dotnet pack src/Aspire.Langfuse.csproj
          --configuration Release --no-build --no-restore
          -p:ContinuousIntegrationBuild=true
          --output artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
